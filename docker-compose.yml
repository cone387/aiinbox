services:
  aiinbox:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: localhost/aiinbox:latest
    container_name: aiinbox
    ports:
      # Host-local only; nginx reverse-proxies aiinbox.cone387.top here.
      - "127.0.0.1:9531:9531"
    volumes:
      # SQLite db, exports and jwt_secret persist in the repo's ./data dir.
      - ./data:/app/data
    restart: unless-stopped
